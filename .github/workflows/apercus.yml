# Robot « Aperçus des actus » — L'Objectif Châlonnais
# Toutes les 15 minutes :
#  - envoie l'alerte des articles programmés dont l'heure est arrivée ;
#  - met à jour la liste des dernières vidéos YouTube (page Direct) ;
#  - fabrique les versions légères des photos de la galerie (affichage rapide)
#    et envoie l'alerte « Nouvel album » une fois l'album prêt ;
#  - fabrique les pages des articles publiés (lisibles par Google, et
#    titre/résumé/photo dans WhatsApp, Facebook, Messenger…), les archives
#    et le plan du site (sitemap.xml).
# On peut aussi le lancer à la main : onglet Actions → Aperçus des actus → Run workflow.
name: Aperçus des actus

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: apercus
  cancel-in-progress: false

jobs:
  apercus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Envoyer les alertes des publications programmées
        run: node scripts/alertes.mjs
        continue-on-error: true

      - name: Récupérer les dernières vidéos YouTube
        run: node scripts/videos.mjs
        continue-on-error: true

      - name: Galerie rapide (versions légères des photos)
        run: |
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then npm install --no-save --no-audit --no-fund --silent sharp@0.33.5; fi
          node scripts/vignettes.mjs
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CODE_EQUIPE: ${{ secrets.CODE_EQUIPE }}
        continue-on-error: true

      - name: Fabriquer les pages des articles et le plan du site
        run: node scripts/apercus.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publier s'il y a du nouveau
        run: |
          git config user.name "Aperçus L'Objectif"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a data sitemap.xml
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Aperçus et vidéos mis à jour"
          git push
          # Demande à GitHub Pages de remettre le site en ligne avec les nouvelles pages
          curl -s -o /dev/null -w "Pages : %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
