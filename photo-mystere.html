<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Photo mystère — L'Objectif Châlonnais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --encre:#142A38; --ciel:#9FD8F5; --ciel-fort:#2E97C7;
    --papier:#F4F8FA; --surface:#FFFFFF; --soft:#5A7383; --line:#D7E3EA;
    --or:#E8B04B; --vert:#2FA06A; --rouge:#DB5B4D;
    --f-titre:'Baloo 2', system-ui, sans-serif;
    --f-corps:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ombre:0 10px 30px rgba(20,42,56,.18);
    --haut:env(safe-area-inset-top,0px);
    --bas:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --papier:#0F2230; --surface:#17313F; --encre:#EAF4F9; --soft:#9DB6C4; --line:#2B4A5E; --ombre:0 10px 30px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:var(--f-corps); color:var(--encre); background:var(--papier);
    position:fixed; inset:0;                 /* surface de jeu fixe : rien ne défile */
  }

  /* ---------- La carte : tout l'écran ---------- */
  #carte{position:absolute; inset:0; background:#20323b; z-index:1;}
  .leaflet-container{font-family:var(--f-corps); background:#20323b;}
  .leaflet-control-zoom{border:none !important; box-shadow:var(--ombre) !important; margin-top:calc(var(--haut) + 12px) !important;}
  .leaflet-control-zoom a{background:var(--surface) !important; color:var(--encre) !important; border-color:var(--line) !important;}
  .leaflet-control-attribution{font-size:10px; background:rgba(255,255,255,.7) !important;}

  /* ---------- Vignette photo-indice (viseur) ---------- */
  .indice{
    position:absolute; left:14px; top:calc(var(--haut) + 14px); z-index:20;
    width:132px; cursor:pointer; border:none; padding:0; background:none; text-align:left;
    transition:transform .15s ease;
  }
  .indice:active{transform:scale(.97);}
  .indice .cadre{
    position:relative; aspect-ratio:4/5; border-radius:14px; overflow:hidden;
    background:linear-gradient(135deg,#2E97C7,#17313F); box-shadow:var(--ombre);
    border:3px solid var(--surface);
    display:grid; place-items:center;
  }
  .indice .cadre img{width:100%; height:100%; object-fit:cover; display:block;}
  .indice .ph{color:#EAF4F9; text-align:center; padding:8px; font-weight:800; font-size:12px; line-height:1.25;}
  .indice .ph b{display:block; font-size:22px; margin-bottom:2px;}
  /* coins de viseur */
  .vis span{position:absolute; width:16px; height:16px; border:2.5px solid #fff; z-index:2; pointer-events:none;}
  .vis .hg{top:8px; left:8px; border-width:2.5px 0 0 2.5px; border-radius:4px 0 0 0;}
  .vis .hd{top:8px; right:8px; border-width:2.5px 2.5px 0 0; border-radius:0 4px 0 0;}
  .vis .bg{bottom:8px; left:8px; border-width:0 0 2.5px 2.5px; border-radius:0 0 0 4px;}
  .vis .bd{bottom:8px; right:8px; border-width:0 2.5px 2.5px 0; border-radius:0 0 4px 0;}
  .indice .loupe{
    position:absolute; right:-7px; bottom:-7px; width:30px; height:30px; border-radius:50%;
    background:var(--or); color:#3a2a00; display:grid; place-items:center; font-size:15px; box-shadow:var(--ombre); z-index:3;
  }

  /* ---------- Bandeau consigne ---------- */
  .consigne{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--bas) + 88px); z-index:15;
    max-width:min(84vw,380px); background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:var(--encre); border:1px solid var(--line); border-radius:999px; padding:9px 18px; box-shadow:var(--ombre);
    font-weight:700; font-size:13.5px; line-height:1.3; text-align:center;
  }
  @media (prefers-color-scheme: dark){ .consigne{background:rgba(23,49,63,.92);} }

  /* ---------- Bouton Valider ---------- */
  .valider{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--bas) + 22px); z-index:25;
    font-family:var(--f-titre); font-weight:800; font-size:18px; letter-spacing:.2px;
    border:none; border-radius:999px; padding:15px 40px; cursor:pointer;
    background:var(--ciel-fort); color:#fff; box-shadow:0 8px 22px rgba(46,151,199,.45);
    transition:transform .14s ease, opacity .2s ease, background .2s ease;
  }
  .valider[disabled]{background:#9fb4c0; box-shadow:none; opacity:.9; cursor:default;}
  .valider:not([disabled]):active{transform:translateX(-50%) scale(.96);}

  /* ---------- Panneau résultat (glisse du bas) ---------- */
  .resultat{
    position:absolute; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-radius:22px 22px 0 0; box-shadow:0 -12px 34px rgba(20,42,56,.22);
    padding:22px 22px calc(22px + var(--bas)); text-align:center;
    transform:translateY(110%); transition:transform .42s cubic-bezier(.22,1,.36,1);
  }
  .resultat.ouvert{transform:translateY(0);}
  .resultat .poignee{width:42px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 16px;}
  .resultat .lieu{color:var(--soft); font-size:14px;}
  .resultat .lieu b{color:var(--encre);}
  .resultat .dist{font-family:var(--f-titre); font-weight:800; font-size:clamp(44px,13vw,64px); line-height:1; margin:4px 0 2px;}
  .resultat .mot{color:var(--soft); font-size:13.5px; margin-bottom:16px;}
  .resultat .score{
    display:inline-flex; align-items:center; gap:10px; font-family:var(--f-titre); font-weight:800; font-size:20px;
    background:var(--or); color:#3a2a00; border-radius:999px; padding:10px 22px; box-shadow:0 6px 16px rgba(232,176,75,.4);
  }
  .resultat .etoile{font-size:18px;}
  .rejouer{
    display:block; width:100%; margin-top:18px; font-family:var(--f-titre); font-weight:800; font-size:16px;
    border:2px solid var(--line); background:transparent; color:var(--encre); border-radius:999px; padding:13px; cursor:pointer;
  }
  .tres-proche .dist{color:var(--vert);} .loin .dist{color:var(--rouge);}

  /* ---------- Agrandir la photo-indice ---------- */
  .loupe-fond{
    position:absolute; inset:0; z-index:60; background:rgba(10,24,34,.82); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .loupe-fond.ouvert{opacity:1; pointer-events:auto;}
  .loupe-fond .grand{
    width:min(90vw,460px); aspect-ratio:4/5; border-radius:18px; overflow:hidden; border:4px solid #fff; box-shadow:var(--ombre);
    background:linear-gradient(135deg,#2E97C7,#17313F); display:grid; place-items:center; color:#EAF4F9; text-align:center; padding:20px; font-weight:800;
  }
  .loupe-fond .grand img{width:100%; height:100%; object-fit:cover;}
  .loupe-fond .fermer{position:absolute; top:calc(var(--haut) + 14px); right:16px; width:42px; height:42px; border-radius:50%; border:none; background:#fff; color:var(--encre); font-size:20px; cursor:pointer; box-shadow:var(--ombre);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  .epingle{filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));}
</style>
</head>
<body>

<div id="carte"></div>

<p class="consigne" id="consigne">👆 Touchez la carte à l'endroit de la photo</p>

<!-- Photo-indice (remplacée par la vraie photo mystère) -->
<button class="indice" id="indice" aria-label="Agrandir la photo mystère">
  <span class="cadre">
    <span class="vis"><span class="hg"></span><span class="hd"></span><span class="bg"></span><span class="bd"></span></span>
    <span class="ph" id="indice-ph"><b>📷</b>Photo mystère<br>(exemple)</span>
    <!-- <img id="indice-img" src="…"> à activer quand la vraie photo sera prête -->
  </span>
  <span class="loupe">⌕</span>
</button>

<button class="valider" id="valider" disabled>Placez votre épingle</button>

<!-- Agrandissement de la photo -->
<div class="loupe-fond" id="loupe-fond">
  <button class="fermer" id="fermer-loupe" aria-label="Fermer">✕</button>
  <div class="grand" id="grand"><span>Ici s'affichera le détail zoomé du lieu mystère, en grand.</span></div>
</div>

<!-- Résultat -->
<section class="resultat" id="resultat" aria-live="polite">
  <div class="poignee"></div>
  <div class="lieu">Le lieu : <b id="r-lieu"></b></div>
  <div class="dist" id="r-dist"></div>
  <div class="mot" id="r-mot">de votre épingle</div>
  <div class="score"><span class="etoile">★</span><span id="r-score"></span></div>
  <button class="rejouer" id="rejouer">Rejouer</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
  // ---- Réglages du jour (à changer à chaque photo mystère) ----
  const REPONSE = { lat: 48.95694, lon: 4.36472, lieu: 'Cathédrale Saint-Étienne' };

  const CENTRE = [48.9566, 4.3637];
  const BORNES = L.latLngBounds([48.930, 4.320], [48.985, 4.408]);

  const carte = L.map('carte', {
    center: CENTRE, zoom: 14, minZoom: 13, maxZoom: 18,
    maxBounds: BORNES, maxBoundsViscosity: 1.0,
    zoomControl: true, attributionControl: true, tap: true
  });

  // Vue satellite (imagerie aérienne Esri) — gratuite, sans clé
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, bounds: BORNES,
    attribution: 'Imagerie © Esri, Maxar, Earthstar Geographics'
  }).addTo(carte);
  // Noms de rues + lieux par-dessus (couches transparentes Esri) — mode « hybride »
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, bounds: BORNES }).addTo(carte);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, bounds: BORNES }).addTo(carte);

  function recadrer(){ carte.invalidateSize(false); }
  carte.whenReady(()=> setTimeout(recadrer, 150));
  window.addEventListener('load', ()=> setTimeout(recadrer, 300));
  window.addEventListener('resize', recadrer);
  window.addEventListener('orientationchange', ()=> setTimeout(recadrer, 350));

  function icone(couleur){
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">'
      + '<path d="M16 0C7.2 0 0 7.2 0 16c0 11.2 16 28 16 28s16-16.8 16-28C32 7.2 24.8 0 16 0z" fill="'+couleur+'"/>'
      + '<circle cx="16" cy="16" r="6.4" fill="#fff"/></svg>';
    return L.icon({ iconUrl: 'data:image/svg+xml;base64,' + btoa(svg), iconSize:[32,44], iconAnchor:[16,44], className:'epingle' });
  }
  const iconeJoueur = icone('#E23744'), iconeVrai = icone('#2FA06A');   // rouge = votre épingle, vert = le vrai lieu

  const $ = (id)=> document.getElementById(id);
  let epingle = null, valide = false;

  carte.on('click', function(e){
    if(valide) return;
    if(!epingle){ epingle = L.marker(e.latlng, { icon: iconeJoueur, draggable: true }).addTo(carte); $('consigne').hidden = true; }
    else epingle.setLatLng(e.latlng);
    const b = $('valider'); b.disabled = false; b.textContent = 'Valider';
  });

  const metres = (n)=> n < 1000 ? Math.round(n) + ' m' : (n/1000).toFixed(n < 10000 ? 2 : 1) + ' km';
  const score  = (d)=> Math.max(0, Math.round(1000 * Math.exp(-d / 800)));

  $('valider').onclick = function(){
    if(!epingle || valide) return;
    valide = true; this.hidden = true;
    const vrai = L.latLng(REPONSE.lat, REPONSE.lon);
    const d = carte.distance(epingle.getLatLng(), vrai);

    L.marker(vrai, { icon: iconeVrai }).addTo(carte).bindPopup('📍 ' + REPONSE.lieu);
    L.polyline([epingle.getLatLng(), vrai], { color:'#2E97C7', weight:4, dashArray:'2 10', lineCap:'round' }).addTo(carte);
    carte.fitBounds(L.latLngBounds([epingle.getLatLng(), vrai]).pad(0.6), { maxZoom: 17, paddingBottomRight:[0,220] });
    if(epingle.dragging) epingle.dragging.disable();

    // compteur de distance animé
    const cible = Math.round(d), t0 = performance.now(), dur = 900;
    (function pas(t){ const k = Math.min(1,(t-t0)/dur); $('r-dist').textContent = metres(Math.round(cible*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(pas); })(t0);

    $('r-lieu').textContent = REPONSE.lieu;
    $('r-score').textContent = score(d) + ' / 1000';
    const box = $('resultat');
    box.classList.toggle('tres-proche', d < 120);
    box.classList.toggle('loin', d > 1200);
    $('r-mot').textContent = d < 120 ? 'bravo, c’était tout près ! 🎯' : (d < 600 ? 'bien joué !' : 'de votre épingle au lieu exact');
    requestAnimationFrame(()=> box.classList.add('ouvert'));
  };

  $('rejouer').onclick = ()=> location.reload();

  // Agrandir / fermer la photo-indice
  $('indice').onclick = ()=> $('loupe-fond').classList.add('ouvert');
  $('fermer-loupe').onclick = ()=> $('loupe-fond').classList.remove('ouvert');
  $('loupe-fond').onclick = (e)=>{ if(e.target === $('loupe-fond')) $('loupe-fond').classList.remove('ouvert'); };
})();
</script>
</body>
</html>
