<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partenaires (équipe) — L'Objectif Châlonnais</title>
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#F4F8FA; --surface:#FFFFFF; --ink:#183140; --ink-soft:#4B6372; --muted:#7A8F9C; --line:#D7E3EA; --tile:#E3EDF2;
    --sky:#2E97C7; --err:#C0472F; --err-bg:#FBEAE6; --ok:#2E7D57; --ok-bg:#E5F4EC; --btn:#183140; --btn-ink:#F4F8FA;
    --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
    --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F2230; --surface:#183140; --ink:#EAF4F9; --ink-soft:#A9C2D0; --muted:#7F99A8; --line:#2B4A5E; --tile:#1D3A4C;
      --sky:#6CC1EA; --err:#F08A73; --err-bg:#3D211B; --ok:#6FCF97; --ok-bg:#163A2A; --btn:#EAF4F9; --btn-ink:#0F2230; color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;}
  a{color:var(--sky);}
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 80px;}
  h1,h2{font-family:var(--font-display);line-height:1.1;margin:0;}
  .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;}
  .top button{background:none;border:none;color:var(--sky);font:inherit;text-decoration:underline;cursor:pointer;padding:0;}
  h1{font-size:clamp(30px,5vw,42px);font-weight:800;margin-top:22px;}
  .sous{color:var(--ink-soft);margin:8px 0 20px;}
  .carte{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  .carte h2{font-size:21px;font-weight:800;margin-bottom:8px;}
  label.l{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
  label.l span{font-weight:600;}
  input[type=text],input[type=url],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);}
  textarea{min-height:80px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .hint{font-size:13px;color:var(--muted);margin:5px 0 0;}
  .case{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;margin-top:14px;}
  .case input{width:18px;height:18px;accent-color:var(--ink);}
  .btn{font:inherit;font-weight:800;border:2px solid var(--btn);border-radius:999px;padding:10px 18px;background:var(--btn);color:var(--btn-ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.petit{padding:6px 12px;font-size:13.5px;}
  .btn.danger{background:transparent;color:var(--err);border-color:var(--line);}
  .btn:disabled{opacity:.5;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center;}
  .msg{margin-top:12px;font-size:14.5px;padding:12px 14px;border-radius:10px;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .msg.err{background:var(--err-bg);color:var(--err);}
  .logo-zone{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .logo-ap{width:140px;height:80px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:12px;color:#7A8F9C;padding:6px;}
  .logo-ap img{max-width:100%;max-height:100%;object-fit:contain;}
  .pa{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .pa:last-child{border-bottom:none;}
  .pa .lg{width:64px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex-shrink:0;}
  .pa .lg img{max-width:100%;max-height:100%;object-fit:contain;}
  .pa .t{flex:1;min-width:0;}
  .pa strong{display:block;}
  .pa small{color:var(--ink-soft);}
  .pa.off{opacity:.55;}
  .pill{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--tile);color:var(--ink-soft);margin-left:6px;}
  .vide{color:var(--ink-soft);font-size:14.5px;}
  .login{max-width:360px;margin:12vh auto 0;text-align:center;}
  .login input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;margin:14px 0 10px;}
  .err{color:var(--err);font-size:14px;}
  @media (max-width:600px){ .g2,.g3{grid-template-columns:minmax(0,1fr);} .wrap{padding-inline:16px;} }
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="vue-login" data-equipe-login>
    <h1>Partenaires</h1>
    <p>Espace réservé à l'équipe.</p>
    <input type="password" id="l-code" placeholder="Code de l'équipe" autocomplete="current-password">
    <button class="btn" id="l-btn" type="submit" style="width:100%;justify-content:center">Ouvrir</button>
    <p class="err" id="l-msg" hidden></p>
  </form>

  <main id="vue-app" hidden>
    <div class="top">
      <a href="equipe.html">⌂ Espace équipe</a>
      <span><a href="partenaires.html" target="_blank" rel="noopener">Voir la page publique ↗</a> · <button type="button" id="btn-quitter">Se déconnecter</button></span>
    </div>
    <h1>Nos partenaires</h1>
    <p class="sous">Les partenaires visibles apparaissent sur la page « Nos partenaires » et dans le bandeau de remerciement de l'accueil.</p>

    <section class="carte" id="carte-form">
      <h2 id="f-titre-carte">Ajouter un partenaire</h2>
      <form id="form" novalidate>
        <div class="g2">
          <div><label class="l" for="f-nom">Nom</label><input type="text" id="f-nom" maxlength="80" placeholder="Ex. Boulangerie Martin"></div>
          <div><label class="l" for="f-act">Activité <span>(facultatif)</span></label><input type="text" id="f-act" maxlength="60" placeholder="Ex. Boulangerie, restaurant, garage…"></div>
        </div>
        <label class="l">Logo <span>(facultatif — idéalement sur fond blanc ou transparent)</span></label>
        <div class="logo-zone">
          <div class="logo-ap" id="f-ap">Aucun</div>
          <label class="btn ghost petit">Choisir<input type="file" id="f-logo" accept="image/*" hidden></label>
          <button type="button" class="btn ghost petit" id="f-sans-logo" hidden>Retirer</button>
        </div>
        <label class="l" for="f-desc">Présentation <span>(facultatif, 500 caractères)</span></label>
        <textarea id="f-desc" maxlength="500" placeholder="Quelques mots sur le partenaire et ce qu'il apporte à L'Objectif."></textarea>
        <label class="l" for="f-offre">Avantage pour nos lecteurs <span>(facultatif)</span></label>
        <input type="text" id="f-offre" maxlength="160" placeholder="Ex. -10 % sur présentation de l'appli L'Objectif">
        <div class="g2">
          <div><label class="l" for="f-adresse">Adresse <span>(facultatif)</span></label><input type="text" id="f-adresse" maxlength="140" placeholder="12 rue de Marne, Châlons-en-Champagne"></div>
          <div><label class="l" for="f-tel">Téléphone <span>(facultatif)</span></label><input type="tel" id="f-tel" maxlength="30"></div>
        </div>
        <div class="g3">
          <div><label class="l" for="f-site">Site web</label><input type="url" id="f-site" placeholder="https://…"></div>
          <div><label class="l" for="f-fb">Facebook</label><input type="url" id="f-fb" placeholder="https://facebook.com/…"></div>
          <div><label class="l" for="f-insta">Instagram</label><input type="url" id="f-insta" placeholder="https://instagram.com/…"></div>
        </div>
        <div class="g3">
          <div><label class="l" for="f-niveau">Place sur la page</label>
            <select id="f-niveau"><option value="principal">Partenaire principal (en grand)</option><option value="partenaire" selected>Partenaire</option><option value="soutien">Soutien (en petit)</option></select></div>
          <div><label class="l" for="f-ordre">Ordre <span>(1 = en premier)</span></label><input type="number" id="f-ordre" min="1" max="999" value="100"></div>
          <div><label class="l" for="f-depuis">Partenaire depuis <span>(facult.)</span></label><input type="date" id="f-depuis"></div>
        </div>
        <label class="case"><input type="checkbox" id="f-actif" checked> Visible sur le site</label>
        <div class="actions">
          <button class="btn" type="submit" id="f-btn">Ajouter</button>
          <button class="btn ghost" type="button" id="f-annuler" hidden>Annuler</button>
          <span style="flex:1"></span>
          <button class="btn danger petit" type="button" id="f-suppr" data-admin hidden>Supprimer</button>
        </div>
        <div class="msg" id="f-msg" hidden></div>
      </form>
    </section>

    <section class="carte">
      <h2>Tous les partenaires</h2>
      <div id="liste"><p class="vide">Chargement…</p></div>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script src="equipe.js"></script>
<script src="actus-rendu.js"></script>
<script>
(function(){
  const A = window.OCActus;
  const $ = (id)=> document.getElementById(id);
  const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, c=> ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
  const NIV = { principal: 'principal', partenaire: 'partenaire', soutien: 'soutien' };
  let code = null, liste = [], edite = null, logo = { etat: 'aucun', data: '' };

  async function connecter(c){
    const r = await A.rpc('oc_partenaires_equipe', { p_code: c });
    code = c; OCEquipe.memoriser(c); OCEquipe.adapter();
    $('vue-login').hidden = true; $('vue-app').hidden = false;
    liste = r.partenaires || []; afficherListe();
  }
  $('vue-login').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const c = $('l-code').value; if(!c) return;
    $('l-msg').hidden = true; $('l-btn').disabled = true;
    try{ await connecter(c); $('l-code').value = ''; }
    catch(err){ $('l-msg').textContent = /function|find/i.test(err.message) ? 'Installez d\'abord supabase/partenaires.sql dans Supabase.' : err.message; $('l-msg').hidden = false; }
    finally{ $('l-btn').disabled = false; }
  });
  $('btn-quitter').onclick = ()=>{ OCEquipe.oublier(); location.reload(); };
  (async ()=>{
    const c = OCEquipe.code();
    if(c && A.configure){ try{ await connecter(c); }catch(e){ $('l-msg').textContent = /function|find/i.test(e.message) ? 'Installez d\'abord supabase/partenaires.sql dans Supabase.' : e.message; $('l-msg').hidden = false; if(/incorrect/i.test(e.message)) OCEquipe.oublier(); } }
    if(!code) $('l-code').focus();
  })();
  async function recharger(){ liste = (await A.rpc('oc_partenaires_equipe', { p_code: code })).partenaires || []; afficherListe(); }

  function afficherListe(){
    const l = $('liste');
    if(!liste.length){ l.innerHTML = '<p class="vide">Aucun partenaire pour l\'instant. Ajoutez le premier ci-dessus.</p>'; return; }
    l.innerHTML = '';
    for(const p of liste){
      const d = document.createElement('div');
      d.className = 'pa' + (p.actif ? '' : ' off');
      d.innerHTML = `<div class="lg">${p.logo ? `<img src="${p.logo}" alt="">` : ''}</div>
        <div class="t"><strong>${esc(p.nom)}<span class="pill">${NIV[p.niveau]}</span>${p.actif ? '' : '<span class="pill">masqué</span>'}</strong>
        <small>${esc([p.activite, p.offre ? '🎁 ' + p.offre : ''].filter(Boolean).join(' · ')) || '&nbsp;'}</small></div>
        <button type="button" class="btn ghost petit">Modifier</button>`;
      d.querySelector('button').onclick = ()=> ouvrir(p);
      l.append(d);
    }
  }

  function vider(){
    edite = null; logo = { etat: 'aucun', data: '' };
    ['f-nom', 'f-act', 'f-desc', 'f-offre', 'f-adresse', 'f-tel', 'f-site', 'f-fb', 'f-insta', 'f-depuis'].forEach(id=> $(id).value = '');
    $('f-niveau').value = 'partenaire'; $('f-ordre').value = 100; $('f-actif').checked = true;
    $('f-titre-carte').textContent = 'Ajouter un partenaire'; $('f-btn').textContent = 'Ajouter';
    $('f-annuler').hidden = true; $('f-suppr').hidden = true; apercu();
  }
  function ouvrir(p){
    edite = p;
    $('f-nom').value = p.nom; $('f-act').value = p.activite || ''; $('f-desc').value = p.description || ''; $('f-offre').value = p.offre || '';
    $('f-adresse').value = p.adresse || ''; $('f-tel').value = p.telephone || '';
    $('f-site').value = p.site || ''; $('f-fb').value = p.facebook || ''; $('f-insta').value = p.instagram || '';
    $('f-niveau').value = p.niveau; $('f-ordre').value = p.ordre; $('f-depuis').value = p.depuis || ''; $('f-actif').checked = !!p.actif;
    logo = p.logo ? { etat: 'garde', data: p.logo } : { etat: 'aucun', data: '' };
    $('f-titre-carte').textContent = 'Modifier « ' + p.nom + ' »'; $('f-btn').textContent = 'Enregistrer';
    $('f-annuler').hidden = false; $('f-suppr').hidden = false; $('f-msg').hidden = true; apercu();
    $('carte-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('f-annuler').onclick = ()=>{ vider(); $('f-msg').hidden = true; };
  function apercu(){ $('f-ap').innerHTML = logo.data ? `<img src="${logo.data}" alt="">` : 'Aucun'; $('f-sans-logo').hidden = !logo.data; }
  $('f-sans-logo').onclick = ()=>{ logo = { etat: 'aucun', data: '' }; apercu(); };

  // Logo : réduit à 600 px ; PNG si possible (transparence), sinon JPEG sur fond blanc
  function preparerLogo(img){
    let max = 600;
    for(;;){
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      const png = c.toDataURL('image/png');
      if(png.length <= 150000) return png;
      const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
      const y = f.getContext('2d'); y.fillStyle = '#fff'; y.fillRect(0, 0, f.width, f.height); y.drawImage(c, 0, 0);
      const jpg = f.toDataURL('image/jpeg', 0.86);
      if(jpg.length <= 150000 || max <= 200) return jpg;
      max = Math.round(max * 0.75);
    }
  }
  $('f-logo').addEventListener('change', (e)=>{
    const fichier = e.target.files && e.target.files[0]; e.target.value = '';
    if(!fichier) return;
    const u = URL.createObjectURL(fichier), img = new Image();
    img.onload = ()=>{ logo = { etat: 'nouveau', data: preparerLogo(img) }; apercu(); URL.revokeObjectURL(u); };
    img.onerror = ()=>{ alert('Cette image ne peut pas être lue.'); URL.revokeObjectURL(u); };
    img.src = u;
  });

  function dire(t, k){ const m = $('f-msg'); m.textContent = t; m.className = 'msg ' + k; m.hidden = false; }
  $('form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const nom = $('f-nom').value.trim();
    if(nom.length < 2){ dire('Indiquez le nom du partenaire.', 'err'); $('f-nom').focus(); return; }
    for(const id of ['f-site', 'f-fb', 'f-insta']){
      const v = $(id).value.trim();
      if(v && !/^https:\/\//.test(v)){ dire('Les liens doivent commencer par https://', 'err'); $(id).focus(); return; }
    }
    const b = $('f-btn'); b.disabled = true;
    try{
      await A.rpc('oc_partenaire_enregistrer', { p_code: code, p: {
        id: edite ? edite.id : null, nom, activite: $('f-act').value.trim(), description: $('f-desc').value.trim(), offre: $('f-offre').value.trim(),
        adresse: $('f-adresse').value.trim(), telephone: $('f-tel').value.trim(),
        site: $('f-site').value.trim(), facebook: $('f-fb').value.trim(), instagram: $('f-insta').value.trim(),
        niveau: $('f-niveau').value, ordre: parseInt($('f-ordre').value, 10) || 100, depuis: $('f-depuis').value, actif: $('f-actif').checked,
        logo: logo.etat === 'nouveau' ? logo.data : '', garder_logo: logo.etat === 'garde'
      } });
      const nouveau = !edite;
      vider(); await recharger();
      dire(nouveau ? `« ${nom} » ajouté. Merci à lui !` : 'Fiche mise à jour.', 'ok');
    }catch(err){ dire(err.message, 'err'); }
    finally{ b.disabled = false; }
  });
  $('f-suppr').onclick = async ()=>{
    if(!edite || !confirm(`Supprimer définitivement « ${edite.nom} » ?\n(Pour une pause, décochez plutôt « Visible sur le site ».)`)) return;
    try{ await A.rpc('oc_partenaire_supprimer', { p_code: code, p_id: edite.id }); vider(); await recharger(); dire('Partenaire supprimé.', 'ok'); }
    catch(err){ dire(err.message, 'err'); }
  };
})();
</script>
</body>
</html>
